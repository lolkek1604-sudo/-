<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Восстановление пароля — Gateway to Dreams</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=12">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-top">
    <a class="auth-back" href="login.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="auth.forgot.back">Вернуться ко входу</span>
    </a>
    <div class="lang">
      <button class="lang-btn" id="langBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#5b6b7d" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18" stroke="#5b6b7d" stroke-width="1.4"/></svg>
        <span id="langLabel">Русский</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="#5b6b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="ru" class="active"><svg class="flag" viewBox="0 0 3 2"><rect width="3" height="2" fill="#fff"/><rect y=".667" width="3" height=".667" fill="#0039a6"/><rect y="1.333" width="3" height=".667" fill="#d52b1e"/></svg>Русский</button>
        <button data-lang="uz"><svg class="flag" viewBox="0 0 3 2"><rect width="3" height="2" fill="#fff"/><rect width="3" height=".62" fill="#0099b5"/><rect y="1.38" width="3" height=".62" fill="#1eb53a"/><rect y=".6" width="3" height=".12" fill="#ce1126"/><rect y="1.28" width="3" height=".12" fill="#ce1126"/></svg>O‘zbekcha</button>
      </div>
    </div>
  </div>

  <div class="auth-main">
    <form class="auth-card" id="forgotForm" novalidate>
      <div class="auth-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 3v18" stroke="#dc2828" stroke-width="2.4" stroke-linecap="round"/><path d="M5 4c3-1.6 6 1.6 9 0s5-1.4 5-1.4v9s-2 .8-5 1.4-6-1.4-9 0V4Z" fill="#16324f"/></svg>
        <span data-i18n="brand">Gateway to Dreams</span>
      </div>
      <h1 data-i18n="auth.forgot.title">Восстановление пароля</h1>
      <p class="sub" data-i18n="auth.forgot.sub">Введите email — пришлём ссылку для сброса пароля.</p>

      <div class="field" id="f-email">
        <label data-i18n="auth.email">Email</label>
        <input type="email" name="email" data-i18n-ph="auth.email.ph" placeholder="your.email@example.com" autocomplete="email">
        <div class="msg" data-i18n="auth.err.email">Введите корректный email</div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" data-i18n="auth.forgot.submit">Отправить ссылку</button>
    </form>
  </div>
</div>

<script src="../assets/js/i18n.js?v=12"></script>
<script src="../assets/js/app.js?v=12"></script>
<script src="../assets/js/auth.js?v=12"></script>
<script>initForgot();</script>
</body>
</html>
